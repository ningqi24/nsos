<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>nsos</title>
  <link rel="stylesheet" href="css/base.css?v=5">
  <link rel="stylesheet" href="css/tokens.css?v=5">
  <link rel="stylesheet" href="css/layers.css?v=6">
  <link rel="stylesheet" href="css/boot.css?v=11">
  <link rel="stylesheet" href="css/desktop.css?v=5">
  <link rel="stylesheet" href="css/system-fix.css?v=5">
  <link rel="stylesheet" href="css/terminal.css?v=1">
</head>
<body>
  <!-- 系统渲染根：所有 Layer 挂载于此 -->
  <div id="os-root">

    <!-- 关机画面 -->
    <section id="layer-poweroff"    class="os-layer" data-state="poweroff" hidden>
      <div class="poweroff-wrap">
        <p>已关机</p>
        <p class="poweroff-hint">按任意键重新开机</p>
      </div>
    </section>

    <!-- 引导层：Bootloader Logo（Android 风格：中央机器人图标 + 品牌名 + 底部版本信息） -->
    <section id="layer-bootloader"  class="os-layer" data-state="boot" hidden>
      <div class="boot-logo-wrap">
        <img class="boot-mascot" src="assets/android_robot_v4.svg" alt="nsos mascot">
        <div class="boot-logo">nsos</div>
      </div>
      <div class="boot-bottom">
        <div class="boot-powered">POWERED BY HTML</div>
        <div class="boot-keys">
          <button class="boot-key" type="button" data-vol="down">FASTBOOT</button>
          <button class="boot-key" type="button" data-vol="up">RECOVERY</button>
        </div>
      </div>
    </section>

    <!-- 引导层：开机动画 -->
    <section id="layer-boot-anim"   class="os-layer" data-state="boot" hidden>
      <div class="boot-anim-wrap">
        <div class="boot-anim-ring"></div>
        <div class="boot-anim-bar"><i id="boot-progress"></i></div>
        <div class="boot-anim-hint">正在启动系统…</div>
      </div>
    </section>

    <!-- 工程模式层 -->
    <section id="layer-fastboot"    class="os-layer" data-state="fastboot" hidden>
      <div class="ft-head"><span>FASTBOOT MODE</span><span class="ft-ver">nsos 0.1.0</span></div>
      <ul class="ft-menu" id="ft-menu"></ul>
      <div class="ft-foot">↑/↓ 选择 · Enter 确认 · 数字键快捷选择</div>
    </section>

    <section id="layer-recovery"    class="os-layer" data-state="recovery" hidden>
      <div class="rc-head">RECOVERY MODE</div>
      <ul class="ft-menu" id="rc-menu"></ul>
      <div class="ft-foot">↑/↓ 选择 · Enter 确认</div>
    </section>

    <!-- 桌面层：真锁屏 -->
    <section id="layer-locked"      class="os-layer" data-state="locked" hidden>
      <div class="lock-content">
        <div class="lock-time">--:--</div>
        <div class="lock-date" id="lock-date"></div>
        <div class="lock-msg" id="lock-msg">解锁后使用 nsos 桌面</div>
        <div class="lock-grip"></div>
      </div>
      <div class="lock-hint">上滑或点击解锁</div>
    </section>

    <!-- 桌面层：Launcher -->
    <section id="layer-home"        class="os-layer" data-state="home" hidden>
      <div class="launcher">
        <div class="launcher-pad"></div>
        <div class="launcher-grid"></div>
        <div class="launcher-dock"></div>
      </div>
    </section>

    <!-- 应用层（P5 填充，终端应用等窗口在此渲染） -->
    <section id="layer-app"         class="os-layer" data-state="app" hidden>
      <div id="app-host"></div>
    </section>

    <!-- 全局系统 UI 挂载点（状态栏/控制中心等，P2/P3） -->
    <div id="os-sysui"></div>

  </div>

  <!-- 内核模块：顺序敏感 -->
  <script src="js/core/event-bus.js?v=5"></script>
  <script src="js/core/state-machine.js?v=6"></script>
  <script src="js/core/storage.js?v=5"></script>
  <script src="js/core/core.js?v=5"></script>
  <script src="js/core/device.js?v=2"></script>
  <script src="js/core/shell.js?v=2"></script>
  <script src="js/main.js?v=7"></script>
  <!-- 组件代码库（P4 铺垫 · Web Components，框架无关） -->
  <script src="js/ui/os-icon.js?v=5"></script>
  <script src="js/ui/os-button.js?v=5"></script>
  <script src="js/ui/os-switch.js?v=5"></script>
  <script src="js/ui/os-slider.js?v=5"></script>
  <script src="js/ui/os-list-item.js?v=5"></script>
  <script src="js/ui/os-badge.js?v=5"></script>
  <script src="js/ui/os-toast.js?v=5"></script>
  <script src="js/ui/os-terminal.js?v=1"></script>
  <script src="js/ui/os-settings.js?v=1"></script>
  <!-- 启动链模块（P1） -->
  <script src="js/boot/input.js?v=5"></script>
  <script src="js/boot/boot.js?v=7"></script>
  <script src="js/boot/modes.js?v=8"></script>
  <script src="js/boot/locked.js?v=5"></script>
  <!-- 桌面层模块（P2/P3） -->
  <script src="js/desktop/statusbar.js?v=6"></script>
  <script src="js/desktop/launcher.js?v=5"></script>
  <script src="js/desktop/notifications.js?v=5"></script>
  <script src="js/desktop/control-center.js?v=5"></script>
  <script src="js/desktop/gestures.js?v=5"></script>
</body>
</html>
